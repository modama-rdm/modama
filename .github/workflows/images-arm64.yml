name: Container images (arm64)

# arm64 images for test deployments on arm64 machines, such as a Linux VM on an Apple Silicon
# Mac. They are kept apart from the amd64 images: this is a workflow of its own, which CI (ci.yml)
# neither calls nor waits for, and it pushes tags of its own, `<tag>-arm64`, so it never writes a
# tag that images.yml pushes.
#
# It runs when CI has passed for a push to master or for a tag, so like images.yml it builds only
# what passed the tests. workflow_run runs this file from the default branch with a write token,
# so it must never build a pull request: the job's `if` only lets pushes through. That's why the
# zizmor finding dangerous-triggers is ignored below.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
  # Any other branch, by hand ("Run workflow"), without waiting for CI.
  workflow_dispatch:
  # A pull request that changes this file tries it out: workflow_run would take the file from
  # master.
  pull_request:
    paths: [.github/workflows/images-arm64.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The commit to build and the branch or tag it was pushed as: those of the CI run, or else
  # this run's own.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    # After CI: only for a push that passed. A pull request: not out of a fork, whose token can't
    # write packages.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
    # Built natively, without emulation. GitHub has no `-latest` label for its arm64 runners.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # at most four runners at a time, so that the jobs of CI don't have to queue behind these
      max-parallel: 4
      matrix:
        # the same images as in images.yml
        include:
          - { name: gateway, dockerfile: deploy/gateway/Dockerfile, context: deploy/gateway }
          - { name: nextcloud, dockerfile: deploy/nextcloud/Dockerfile, context: deploy/nextcloud }
          - { name: permissions, dockerfile: deploy/permissions/Dockerfile, context: . }
          - { name: sssd, dockerfile: deploy/sssd/Dockerfile, context: . }
          - { name: watchdog, dockerfile: deploy/watchdog/Dockerfile, context: . }
          - { name: smbdrop, dockerfile: modama-rs/Dockerfile-smbdrop, context: modama-rs }
          - { name: ca, dockerfile: modama-rs/Dockerfile-ca-cli, context: modama-rs }
          - { name: mgmtinterface, dockerfile: deploy/mgmtinterface/Dockerfile, context: . }
          - { name: mgmtinterface-api, dockerfile: deploy/mgmtinterface-api/Dockerfile, context: . }
          - { name: wsgidav, dockerfile: deploy/wsgidav/Dockerfile, context: deploy/wsgidav }
          - { name: mgmtinterface-new, dockerfile: mgmtinterface-new/Dockerfile, context: . }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The tags of images.yml, each with `-arm64` appended: `sha-<long sha>-arm64` always, the
      # git tag when the run is for one, and `latest-arm64` for releases (vX.Y.Z) only.
      - id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: |
          image=${IMAGE,,}
          tags=("$image:sha-$SHA-arm64")
          # A CI run names a git tag like a branch, so look the name up as a tag of this commit.
          # The last line is the commit also for an annotated tag.
          found=$(git ls-remote origin "refs/tags/$REF_NAME" "refs/tags/$REF_NAME^{}")
          if [[ "$(tail -n 1 <<<"$found" | cut -f 1)" == "$SHA" ]]; then
            tags+=("$image:${REF_NAME//[^A-Za-z0-9_.-]/-}-arm64")
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags+=("$image:latest-arm64")
            fi
          fi
          printf '%s\n' "${tags[@]}"
          { echo "tags<<EOF"; printf '%s\n' "${tags[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      # A tag without `-arm64` is one that serves amd64: pushing an arm64 image to it would break
      # every deployment that pulls it. So this is checked, whatever the step above is changed to.
      - name: Check that every tag ends in -arm64
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          if [[ -z "$TAGS" ]] || grep -v -e '-arm64$' <<<"$TAGS"; then
            echo "::error::Expected only tags that end in -arm64, so nothing is pushed."
            exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No build cache, neither read nor written: the Actions caches are at their limit with the
      # amd64 images alone (see the comment on caches in ci.yml), and nothing waits for this build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
