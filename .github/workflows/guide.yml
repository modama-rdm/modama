name: Guide

# Builds the mdBook guide in docs/guide. Pull requests only check that it builds; master
# publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  pull_request:
    paths:
      - docs/guide/**
      - .github/workflows/guide.yml
  push:
    branches: [master]
    paths:
      - docs/guide/**
      - .github/workflows/guide.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: mdbook@0.5.4
      # The site's base path (/<repository>/, or / with a custom domain). mdBook needs it only
      # for the links on its 404 page; all other pages link relatively.
      - id: pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mdbook build
        working-directory: docs/guide
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_path }}/
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/guide/book

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    # one deployment at a time, and don't cancel one that has started
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
