[package]
name = "modama-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "modama-agent"
path = "src/bin/modama-agent.rs"

[[bin]]
name = "test-ws-server"
path = "src/bin/test-ws-server.rs"

[[bin]]
name = "generate-openapi"
path = "src/bin/generate-openapi.rs"

[lib]
name = "modama_agent"
path = "src/lib/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json", "macros"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
axum-macros = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
futures-util = "0.3.29"
log = { workspace = true }
rustls-pemfile = { workspace = true }
scopeguard = "1.2.0"
serde = { workspace = true, features=["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true}
tokio = { workspace = true , features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }
modama-common = { path = "../modama-common" }
axum-extra = { workspace = true, features = ["typed-header"] }
utoipa = { workspace = true, features = ["macros"] }
versioned = { path = "../versioned" }
minijinja = { version = "2.12.0", features = ["loader"] }
time = { version = "0.3.42", features = ["local-offset"] }
reqwest = { workspace = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true }
hostname = "0.4.1"
network-interface = "2.0.3"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"]}
directories = "6.0.0"
rand = { workspace = true }
percent-encoding = { workspace = true }
tower-http = { workspace = true, features = ["csrf"] }

[target.'cfg(windows)'.dependencies]
file-rotate = "0.8.0"
windows-service = "0.8.1"
windows = { version = "0.62.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
] }
widestring = { version = "1.1.0" }

[target.'cfg(unix)'.dependencies]
async-dns = "0.1.0"
procfs = { workspace = true }
nix = { workspace = true, features = ["mount"] }

[lints]
workspace = true

[dev-dependencies]
smbdrop = { path = "../smbdrop" }
rustls = { workspace = true }
tower = { version = "0.5.2", features = [] }
http-body-util = "0.1.3"
mockito = "1.7.0"
