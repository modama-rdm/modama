[package]
name = "modama-agent-gui"
version = "0.1.0"
edition.workspace = true

[features]
visual-tests = ["dep:egui_kittest"]
inspection = ["eframe/inspection"]

[dependencies]
eframe = "0.35.0"
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { version = "0.4.2", default-features = false }
base64 = "0.22.1"
egui_extras = { version = "0.35.0", features = ["svg"] }
egui_taffy = "0.13"
egui-phosphor = "0.13"
modama-common = { path = "../modama-common" }
strsim = "0.11"
time = { version = "0.3.42", features = ["local-offset"] }
url = { workspace = true }
thiserror = { workspace = true }
egui_kittest = { version = "0.35.0", optional = true, features = ["eframe", "snapshot", "wgpu"] }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.34"
csscolorparser = "0.8.3"
openapi-to-rust = { version = "0.12.0", default-features = false }
serde_json = { workspace = true }

[dev-dependencies]
csscolorparser = "0.8.3"
mockito = "1.7.0"
tokio = { workspace = true }

[[test]]
name = "login_visual"
path = "tests/login_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "overview_visual"
path = "tests/overview_visual.rs"
required-features = ["visual-tests"]

[[test]]
name = "selection_visual"
path = "tests/selection_visual.rs"
required-features = ["visual-tests"]

[lints]
workspace = true
