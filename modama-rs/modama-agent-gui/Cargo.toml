[package]
name = "modama-agent-gui"
version = "0.1.0"
edition.workspace = true

[features]
visual-tests = ["dep:egui_kittest"]

[dependencies]
eframe = "0.34.3"
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
egui_extras = { version = "0.34.3", features = ["svg"] }
modama-common = { path = "../modama-common" }
url = { workspace = true }
thiserror = { workspace = true }
egui_kittest = { version = "0.34.0", optional = true, features = ["eframe", "snapshot", "wgpu"] }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.34"
csscolorparser = "0.8.3"

[dev-dependencies]
csscolorparser = "0.8.3"

[[test]]
name = "login_visual"
path = "tests/login_visual.rs"
required-features = ["visual-tests"]

[lints]
workspace = true
