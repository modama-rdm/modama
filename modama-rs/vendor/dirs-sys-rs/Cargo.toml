[package]
name        = "dirs-sys"
version     = "0.5.0"
authors     = ["Simon Ochsenreither <simon@ochsenreither.de>"]
description = "System-level helper functions for the dirs and directories crates."
readme      = "README.md"
license     = "MIT OR Apache-2.0"
repository  = "https://codeberg.org/dirs/dirs-sys-rs"
maintenance = { status = "as-is" }

[dependencies]
option-ext = "0.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "redox")'.dependencies]
redox_users = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { git = "https://github.com/microsoft/windows-rs.git", rev = "2d02953511f43129370b5732a66aa64367d83342", features = [
    "combaseapi",
    "shlobj_core",
    "winbase",
] }
