[workspace]
members = [
    "smbdrop",
    "modama-agent",
    "modama-common",
    "modama-agent-gui",
    "version-range",
    "versions-macro",
    "versioned",
]
package.edition = "2021"
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.76"
axum = { version = "0.8.4", features = ["json"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-macros = "0.5.0"
clap = { version = "4.4.11", features = ["derive"] } 
log = "0.4.20"
thiserror = "2.0.16"
tokio = { version = "1.35.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "signal", "sync"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.27.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
env_logger = "0.11.8"
reqwest = { version = "0.12.23", features = ["rustls-tls-no-provider", "json"], default-features = false }
rustls = { version = "0.23", features = ["ring"], default-features = false }
url = "2.5.0"
toml = "0.9.5"
tokio-rustls = { version = "0.26.2", default-features = false }
regex = "1.10.2"
hyper-util = "0.1.2"
hyper = "1.1.0"
tower-service = "0.3.2"
rustls-pemfile = "2.0.0"
x509-parser = "0.18.0"
nix = { version = "0.30.1", features = ["mount"] }
procfs = "0.18.0"
rand = "0.9.2"
jsonwebtoken = "9.2.0"
percent-encoding = "2.3.1"
git-version = "0.3.9"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
utoipa = { version = "5", features = ["axum_extras", "macros"] }
utoipa-axum = "0.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
