[package]
name = "modama-common"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "ca"
path = "src/bin/ca_cli.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rcgen = { version = "0.14.4", features = ["x509-parser", "ring"] }
env_logger = { workspace = true }
log = { workspace = true}
reqwest = { workspace = true, features = ["rustls-tls", "json"], default-features = false }
rustls = { workspace = true, features=["ring"] }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "fs", "signal"] }
tokio-rustls = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
git-version = { workspace = true }
pkcs8 = { version = "0.11.0", features = ["pkcs5", "getrandom", "alloc", "pem", "encryption"] }
rpassword = "7.5.2"

[lints]
workspace = true
