services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile-test-runner
    working_dir: /test-env/
    # The agent answers the foreground API for the caller's user, which it looks up from the
    # connection in its own network namespace. So the tests run in the agent's namespace, as the
    # same user as the session helper in `session-1`.
    network_mode: "service:modama-agent-1"
    user: "1000"
    volumes:
      - ./:/test-env:ro
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    depends_on:
      smbdrop:
        condition: service_healthy
      modama-agent-1:
        condition: service_healthy
      modama-agent-2:
        condition: service_healthy
      modama-agent-untrusted:
        condition: service_healthy
      session-1:
        condition: service_started
    stop_signal: SIGKILL

  smbdrop-init:
    image: debian:13-slim
    container_name: smbdrop-init
    command: "bash -c 'rm -rf /data/adhoc/ && mkdir -p /data/adhoc/testproject/session{1,2,3,4,5,6,7}/raw/'"
    volumes:
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    networks:
      - modama-network

  smbdrop:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: smbdrop
    ports:
      # not needed by the tests (they use the compose network); a high port works with rootless podman
      - "127.0.0.1:1446:445"
    volumes:
      - ./certs:/certs:ro
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
      - ./target:/usr/src/modama-rs/target/
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    networks:
      - modama-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "http://127.0.0.1:5051/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12
    environment: {}
    #   - "MODAMA_LOG_LEVEL=debug"
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "smbdrop"
      - "--"
      - "--ca-cert=/certs/ca/pub/ca.cert.pem"
      - "--chain=/certs/servers/smbdrop/smbdrop.chain.pem"
      - "--privkey=/certs/servers/smbdrop/smbdrop.priv.pem"
      - "--api-listen=0.0.0.0:5051"
      - "--ws-listen=0.0.0.0:5052"
      - "--token-api-listen=0.0.0.0:5053"

  modama-agent-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-1
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent1.toml"
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version: 1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  # The session helper of modama-agent-1, mounting via GVfs as user `ingest` (uid 1000).
  session-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for /dev/fuse (GVfs FUSE bridge)
    container_name: session-1
    # same network namespace as the agent, so it can identify the helper's user from the socket
    network_mode: "service:modama-agent-1"
    depends_on:
      modama-agent-1:
        condition: service_healthy
    volumes:
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
    command:
      - "bash"
      - "-c"
      - |
        set -e
        cargo build --target-dir /usr/src/modama-rs/target/ --release --bin modama-agent-gui
        install -d -o ingest -m 700 /run/user/1000
        exec runuser -u ingest -- env HOME=/home/ingest XDG_RUNTIME_DIR=/run/user/1000 \
          dbus-run-session -- /usr/src/modama-rs/target/release/modama-agent-gui \
          --agent-url http://localhost:3003/ session-helper

  modama-agent-2:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-2
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent2.toml"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version: 1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  modama-agent-untrusted:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-untrusted
    depends_on:
      smbdrop:
        condition: service_healthy
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
      - ./cargo-cache:/usr/local/cargo/registry/cache/
      - ./cargo-git:/usr/local/cargo/git/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent-untrusted.toml"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "12", "--header", "X-API-Version: 1.0.0", "http://127.0.0.1:3003/api/health/"]
      interval: 5s
      timeout: 15s
      start_period: 5m
      retries: 12

  mgmtinterface:
    hostname: mgmtinterface
    restart: always
    # build:
    #   context: ../../../
    #   dockerfile: er-c-data/mgmtinterface/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface:latest
    environment:
      - MGMTINTERFACE_SECRET=/mgmt_secret.py
    volumes:
      - type: bind
        source: "./mgmt_secret.py"
        target: "/mgmt_secret.py"
      - type: bind
        source: "./certs/ca/pub/"
        target: "/certs/ca/pub/"
        read_only: true
    depends_on:
      smbdrop:
        condition: service_healthy
      permissions:
        condition: service_started
    working_dir: /
    command: /venv/bin/flask --app mgmtinterface:app run --debug --port 5000 --host 0.0.0.0
    networks:
      - modama-network

  permissions:
    hostname: permissions
    restart: always
    volumes:
      - type: bind
        source: "./testfolder/data/"
        target: "/data/"
    image: iffregistry.fz-juelich.de/weber/data-management-system/permissions:latest
    cap_add:
      - LINUX_IMMUTABLE
    networks:
      - modama-network
    environment:
      - FLASK_APP=permissions.server:app
    command: /venv/bin/flask run --without-threads --debug --port 5050 --host 0.0.0.0

networks:
  modama-network:
    driver: bridge
