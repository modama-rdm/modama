services:
  smbdrop:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: smbdrop
    ports:
      - "445:445"
    volumes:
      - smbdrop_data:/data
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    networks:
      - modama-network
    command:
      - "cargo"
      - "llvm-cov"
      - "run"
      - "--no-clean"
      - "--bin"
      - "smbdrop"
      - "--"
      - "--ca-cert=/certs/ca/ca.cert.pem"
      - "--chain=/certs/servers/smbdrop.chain.pem"
      - "--privkey=/certs/servers/smbdrop.priv.pem"
      - "--api-listen=0.0.0.0:5051"
      - "--ws-listen=0.0.0.0:5052"
      - "--token-api-listen=0.0.0.0:5053"

  modama-agent-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: modama-agent-1
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "llvm-cov"
      - "run"
      - "--no-clean"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--event-url=wss://smbdrop:5052"
      - "--token-service=https://smbdrop:5053"
      - "--mgmt-api-url=http://mgmtinterface"
      - "--listen-local-api=localhost:3003"
      - "--smb-hostname=smbdrop"
      - "--smb-port=445"
      - "--smb-domain=ER-C-Ingest"
      - "--ca-cert=/certs/ca/ca.cert.pem"
      - "--chain=/certs/clients/testresource/agent1.chain.pem"
      - "--key=/certs/clients/testresource/agent1.priv.pem"

  modama-agent-2:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: modama-agent-2
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "llvm-cov"
      - "run"
      - "--no-clean"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--event-url=wss://smbdrop:5052"
      - "--token-service=https://smbdrop:5053"
      - "--mgmt-api-url=http://mgmtinterface"
      - "--listen-local-api=localhost:3003"
      - "--smb-hostname=smbdrop"
      - "--smb-port=445"
      - "--smb-domain=ER-C-Ingest"
      - "--ca-cert=/certs/ca/ca.cert.pem"
      - "--chain=/certs/clients/testresource/agent2.chain.pem"
      - "--key=/certs/clients/testresource/agent2.priv.pem"

  modama-agent-untrusted:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: modama-agent-untrusted
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "llvm-cov"
      - "run"
      - "--no-clean"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--event-url=wss://smbdrop:5052"
      - "--token-service=https://smbdrop:5053"
      - "--mgmt-api-url=http://mgmtinterface"
      - "--listen-local-api=localhost:3003"
      - "--smb-hostname=smbdrop"
      - "--smb-port=445"
      - "--smb-domain=ER-C-Ingest"
      - "--ca-cert=/certs/ca/ca.cert.pem"

  tests:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: modama-tests
    volumes:
      - ./target:/usr/src/modama-rs/target/
    profiles: ["tests"]  # don't run with default "docker compose up" command
    command:
      - /bin/bash
      - "-c"
      - "cargo llvm-cov --no-report"

  only-report:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    container_name: modama-tests
    volumes:
      - ./target:/usr/src/modama-rs/target/
      - ./report-target:/usr/src/modama-rs/target/llvm-cov/
    profiles: ["tests"]  # don't run with default "docker compose up" command
    command:
      - /bin/bash
      - "-c"
      - "cargo llvm-cov report --html"

  mgmtinterface:
    hostname: mgmtinterface
    restart: always
    # build:
    #   context: ../../../
    #   dockerfile: er-c-data/mgmtinterface/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface:latest
    environment:
      - MGMTINTERFACE_SECRET=/mgmt_secret.py
    volumes:
      - type: bind
        source: "./mgmt_secret.py"
        target: "/mgmt_secret.py"
    depends_on:
      - "smbdrop"

volumes:
  smbdrop_data:

networks:
  modama-network:
    driver: bridge
