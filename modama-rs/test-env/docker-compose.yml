services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile-test-runner
    working_dir: /tests
    networks:
      - modama-network
    volumes:
      - ./tests:/tests:ro
    depends_on:
      - smbdrop

  smbdrop-init:
    image: debian:13-slim
    container_name: smbdrop-init
    command:
      - sh
      - -c
      - mkdir -p /data/adhoc/testproject/session1
    volumes:
      - smbdrop_data:/data
    networks:
      - modama-network

  smbdrop:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: smbdrop
    ports:
      - "445:445"
    volumes:
      - smbdrop_data:/data
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    networks:
      - modama-network
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "smbdrop"
      - "--"
      - "--ca-cert=/certs/ca/pub/ca.cert.pem"
      - "--chain=/certs/servers/smbdrop/smbdrop.chain.pem"
      - "--privkey=/certs/servers/smbdrop/smbdrop.priv.pem"
      - "--api-listen=0.0.0.0:5051"
      - "--ws-listen=0.0.0.0:5052"
      - "--token-api-listen=0.0.0.0:5053"

  modama-agent-1:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-1
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent1.toml"

  modama-agent-2:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-2
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent2.toml"

  modama-agent-untrusted:
    build:
      context: ..
      dockerfile: test-env/Dockerfile-tests
    privileged: true  # for mount support
    container_name: modama-agent-untrusted
    depends_on:
      - smbdrop
    networks:
      - modama-network
    volumes:
      - ./certs:/certs:ro
      - ./target:/usr/src/modama-rs/target/
    command:
      - "cargo"
      - "run"
      - "--target-dir"
      - "/usr/src/modama-rs/target/"
      - "--release"
      - "--bin"
      - "modama-agent"
      - "--"
      - "--config-path=/certs/agent-untrusted.toml"


  mgmtinterface:
    hostname: mgmtinterface
    restart: always
    # build:
    #   context: ../../../
    #   dockerfile: er-c-data/mgmtinterface/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface:latest
    environment:
      - MGMTINTERFACE_SECRET=/mgmt_secret.py
    volumes:
      - type: bind
        source: "./mgmt_secret.py"
        target: "/mgmt_secret.py"
    depends_on:
      - "smbdrop"

volumes:
  smbdrop_data:

networks:
  modama-network:
    driver: bridge
