[package]
name = "modama-session-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
futures-util = "0.3.29"
log = { workspace = true }
modama-common = { path = "../modama-common" }
rand = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tungstenite = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
widestring = { version = "1.1.0" }
windows = { version = "0.62.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
percent-encoding.workspace = true
# disabled default features so we don't depend on library symbols that
# are only available in latest glib:
gio = { version = "0.22", default-features = false }
glib = { version = "0.22", default-features = false }
# FileManager1 for the mount popup's "Open network drive", and the tray (ksni)
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# notification-area icon (StatusNotifierItem)
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }

[lints]
workspace = true
