[global]
    smb ports = 1445
    server role = standalone server
    map to guest = never
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null

[ingest]
    path = /srv/ingest
    read only = no
    valid users = testuser

[ingest2]
    path = /srv/ingest2
    read only = no
    valid users = testuser

[other]
    path = /srv/other
    read only = no
    valid users = testuser
