version: '3.4'
services:
  db:
    environment:
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: always
    image: postgres:12
    volumes:
      - type: bind
        source: "/cachedata/data-mgmt/postgres"
        target: "/var/lib/postgresql/data"
  
  redis:
    image: "redis:alpine"

    command: redis-server /usr/local/etc/redis/redis.conf

    volumes:
      - type: bind
        source: "/cachedata/data-mgmt/redis.conf"
        target: "/usr/local/etc/redis/redis.conf"

    # volumes:
    #  - $PWD/redis-data:/var/lib/redis
    #   - $PWD/redis.conf:/usr/local/etc/redis/redis.conf

    environment:
     - REDIS_REPLICATION_MODE=master

  nextcloud:
    hostname: nextcloud
    build: ./nextcloud

    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"

      REDIS_HOST: "redis"
      REDIS_HOST_PASSWORD: "redis"

      NEXTCLOUD_ADMIN_USER: root
      NEXTCLOUD_ADMIN_PASSWORD: "secret"

      NEXTCLOUD_DATA_DIR: "/var/local/nextclouddata"

      NEXTCLOUD_TRUSTED_DOMAINS: "localhost moellenstedt.iff.kfa-juelich.de 134.94.162.235"

      APACHE_DISABLE_REWRITE_IP: 1

      # Didn't work, unfortunately
      # TRUSTED_PROXIES: "localhost"

    links:
      - "db"
      - "redis"
      - "webdav"

    ports:
      - "127.0.0.1:888:80"

    volumes:
       - type: bind
         source: "/cachedata/data-mgmt/nextcloud-html"
         target: "/var/www/html"
       - type: bind
         source: "/cachedata/data-mgmt/nextcloud-data"
         target: "/var/local/nextclouddata"

    restart: always

  # nextcloudweb:
  #   hostname: nextcloudweb
  #   build: ./nextcloudweb

  #   links:
  #     - "db"
  #     - "redis"

  #   ports:
  #     - 8089:80

  #   volumes:
  #     - nextclouddata:/var/local/nextclouddata

  #   restart: always

  webdav:
    hostname: webdav
    build: './wsgidav'

    volumes:
      # Use host's accounts
      # Requires libpam-sss and libnss-sss in container
      # https://jhrozek.wordpress.com/2015/03/31/authenticating-a-docker-container-against-hosts-unix-accounts/
      - type: bind
        source: "/var/lib/sss/pipes/"
        target: "/var/lib/sss/pipes/"
      # Data directory to export
      - type: bind
        source: "/storage/holo/clausen/testdata"
        target: "/var/wsgidav-root"

  backup:
    hostname: backup
    build: ./tsm-client

    env_file:
      # To not have password in config
      /cachedata/data-mgmt/tsm-backup-password.env

    # environment:
      # PASSWORD: "abcd.1234"
      # Dummy password for testing
      # PASSWORD comes from env_file

    volumes:
      # Config
      - type: bind
        source: "/cachedata/data-mgmt/dsm.sys"
        target: "/opt/tivoli/tsm/client/ba/bin/dsm.sys"
      # Backup domains (file systems)
      # TSM doesn't cross file system boundaries and doesn't follow symbolic links,
      # i.e. each folder needs its own domain entry in dsm.sys and its own bind mount
      - type: bind
        source: "/cachedata/users/weber/backuptest"
        target: "/mnt/data/backuptest"
      - type: bind
        source: "/storage/holo/clausen/testdata/"
        target: "/mnt/data/smallstorage-testdata"
      - type: bind
        source: "/cachedata/data-mgmt/"
        target: "/mnt/data/data-mgmt"
