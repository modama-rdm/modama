server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Content-hashed build assets: cache hard (filenames change every build) and
    # never fall back to index.html — a missing asset must 404, not return HTML.
    location /new/assets/ {
        try_files $uri =404;
        add_header Cache-Control public,max-age=31536000,immutable;
    }

    # The SPA lives under /new/ . Serve real files
    # directly; treat every other path under /new/ as a client-side route and
    # fall back to the app shell so deep links / refreshes work.
    location /new/ {
        index index.html;
        try_files $uri $uri/ /new/index.html;
    }
}
