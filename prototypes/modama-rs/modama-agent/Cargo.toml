[package]
name = "modama-agent"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "modama-agent"
path = "src/bin/modama-agent.rs"

[[bin]]
name = "test-ws-server"
path = "src/bin/test-ws-server.rs"

[[bin]]
name = "testnetuse"
path = "src/bin/testnetuse.rs"

[lib]
name = "modama_agent"
path = "src/lib/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
axum-macros = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
futures-util = "0.3.29"
log = { workspace = true }
rustls-pemfile = { workspace = true }
scopeguard = "1.2.0"
serde = { workspace = true, features=["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true}
tokio = { workspace = true , features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }
modama-common = { path = "../modama-common" }
axum-extra = { workspace = true, features = ["typed-header"] }
minijinja = { version = "2.12.0", features = ["loader"] }
time = { version = "0.3.42" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["Win32_NetworkManagement_WNet", "Win32_NetworkManagement_NetManagement"] }
widestring = { version = "1.1.0" }

[target.'cfg(unix)'.dependencies]
async-dns = "0.1.0"
procfs = { workspace = true }
nix = { workspace = true, features = ["mount"] }

[lints]
workspace = true
