[package]
name = "smbdrop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "smbdrop"
path = "src/bin/smbdrop.rs"

[[bin]]
name = "test-immutable"
path = "src/bin/test-immutable.rs"

[lib]
name = "smbdrop"
path = "src/lib/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive"] } 
env_logger = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rustls-pemfile = "2.0.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "fs", "signal"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true , features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { version = "1.6.1", features = ["v4"] }
futures-util = "0.3.30"
modama-common = { path = "../modama-common" }
rustls = { workspace = true, features = ["ring"] }
hyper-util = { workspace = true }
hyper = { workspace = true }
tower-service = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-no-provider", "json"], default-features = false }
jsonwebtoken = { workspace = true }
itertools = "0.14.0"

[target.'cfg(unix)'.dependencies]
procfs = { workspace = true }
etc-passwd = "0.2.0"
nix = { workspace = true, features = [ "mount", "ioctl", "signal"] }

[lints]
workspace = true
