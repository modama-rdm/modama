[package]
name = "modama-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modama-agent"
path = "src/bin/modama-agent.rs"

[[bin]]
name = "test-ws-server"
path = "src/bin/test-ws-server.rs"

[[bin]]
name = "ca"
path = "src/bin/ca.rs"

[lib]
name = "modama_agent"
path = "src/lib/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
axum = { version = "0.7.2", features = ["json"] }
axum-macros = "0.4.0"
clap = { version = "4.4.11", features = ["derive"] }
env_logger = "0.10.1"
futures-util = "0.3.29"
log = "0.4.20"
rcgen = { version = "0.12.0", features = ["x509-parser"] }
rustls-pemfile = "2.0.0"
scopeguard = "1.2.0"
serde = { version = "1.0.193", features=["derive"] }
serde_json = "1.0.108"
thiserror = "1.0.50"
tokio = { version = "1.35.0", features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = "0.25.0"
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-webpki-roots"] }
toml = "0.8.8"
tungstenite = "0.21.0"
url = "2.5.0"
x509-parser = "0.15.1"

[target.'cfg(windows)'.dependencies]

[target.'cfg(unix)'.dependencies]
async-dns = "0.1.0"
procfs = "0.16.0"
nix = { version = "0.27.1", features = ["mount"] }
