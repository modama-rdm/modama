[package]
name = "modama-agent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-dns = "0.1.0"
axum = { version = "0.7.2", features = ["json"] }
axum-macros = "0.4.0"
env_logger = "0.10.1"
futures-util = "0.3.29"
log = "0.4.20"
nix = { version = "0.27.1", features = ["mount"] }
scopeguard = "1.2.0"
serde = { version = "1.0.193", features=["derive"] }
serde_json = "1.0.108"
tokio = { version = "1.35.0", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.21.0"
tungstenite = "0.21.0"
url = "2.5.0"
