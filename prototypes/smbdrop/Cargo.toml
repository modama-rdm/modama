[package]
name = "smbdrop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "test-immutable"
path = "src/bin/test-immutable.rs"

[lib]
name = "smbdrop"
path = "src/lib/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.76"
axum = "0.7.2"
clap = { version = "4.4.11", features = ["derive"] } 
env_logger = "0.10.1"
etc-passwd = "0.2.0"
log = "0.4.20"
nix = { version = "0.27.1", features = [ "mount", "ioctl", "signal"] }
procfs = "0.16.0"
rand = "0.8.5"
regex = "1.10.2"
rustls-pemfile = "2.0.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
thiserror = "1.0.52"
tokio = { version = "1.35.1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-webpki-roots"] }
toml = "0.8.8"
tungstenite = "0.21.0"
url = "2.5.0"
uuid = { version = "1.6.1", features = ["v4"] }
