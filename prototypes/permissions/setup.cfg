[metadata]
name = permissions
version = 0.0.1

[options]
zip_safe = False
include_package_data = True
package_dir =
    =src
packages = find:
python_requires = >=3.6
install_requires =
    pylibacl
    flask
    jsonschema
    # NOTE: pysss not installable from pypi (yet?) https://github.com/SSSD/sssd/issues/5553

[options.packages.find]
where = src
