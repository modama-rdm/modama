server {
    listen 80;
    listen [::]:80;
    server_name er-c-data-mgmt.fz-juelich.de;
    return 301 https://$server_name$request_uri;
}

server {
    # later: enable http3/quic
    # listen 443 quic reuseport;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name er-c-data-mgmt.fz-juelich.de;

    ssl_certificate /etc/nginx/ssl/er-c-data-mgmt.fz-juelich.de.chain.pem;
    ssl_certificate_key /etc/nginx/ssl/er-c-data-mgmt.fz-juelich.de.privkey.pem;

    location ^~ / {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
   }
}
