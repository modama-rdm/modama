version: '3.4'
services:
  db:
    volumes:
      - type: bind
        source: "./testfolder/postgres"
        target: "/var/lib/postgresql/data"
  nextcloud:
    volumes:
      - type: bind
        source: "./testfolder/nextcloud-html"
        target: "/var/www/html"
      - type: bind
        source: "./testfolder/nextcloud-data"
        target: "/var/local/nextclouddata"
      - type: bind
        source: "./testconf/nextcloud-site-config.json"
        target: "/nextcloud-site-config.json"
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-config-secret.json"
        target: "/nextcloud-config-secret.json"
      - type: bind
        source: "/var/local/data-mgmt/externalstorage_pw"
        target: "/externalstorage_pw"
  webdav-backend:
    volumes:
      # Data directory to export
      - "./testfolder/data/:/var/wsgidav-root"
  webdav:
    volumes:
      # Data directory to export
      - "./testfolder/data/:/data/"
    ports:
      - "127.0.0.1:8081:8080"
  sampledb:
    hostname: sampledb
    image: sciapp/sampledb:develop
    depends_on:
      - db
    environment:
      SAMPLEDB_CONTACT_EMAIL: d.weber@fz-juelich.de
      SAMPLEDB_MAIL_SERVER: mail.fz-juelich.de
      SAMPLEDB_MAIL_SENDER: d.weber@fz-juelich.de
      # TODO put in secrets file
      SAMPLEDB_ADMIN_PASSWORD: "abcd1234"
      SAMPLEDB_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:password@db:5432/sampledb
    restart: always
    volumes:
      - './testfolder/sampledb:/home/sampledb/files:rw'
    ports:
      - "127.0.0.1:8023:8000"
  cloudproxy:
    volumes:
      - './testconf/cloudproxy-servername.nginx.conf.snippet:/etc/nginx/conf.d/servername.conf.snippet'
      - './testconf/cloudproxy-sampledb.nginx.conf.snippet:/etc/nginx/conf.d/sampledb.conf.snippet'
    ports:
      - "127.0.0.1:1890:80"
  permissions:
    restart: no
    volumes:
      - type: bind
        source: "./testfolder/data"
        target: "/data"
      - type: bind
        source: "../python/permissions"
        target: "/code/permissions"
        read_only: true
    environment:
      - FLASK_APP=permissions.server:app
    working_dir: /
    # command: /venv/bin/gunicorn --bind 0.0.0.0:5050 permissions.server:app --log-level=debug
    # Disable threading to avoid Flask server crashes after authenticate() function is called
    # Might be related to https://sourceware.org/bugzilla/show_bug.cgi?id=21032
    command: /venv/bin/flask run --without-threads --debug --port 5050 --host 0.0.0.0
  watchdog:
    volumes:
      - type: bind
        source: "./testfolder/data"
        target: "/data"
  smbdrop:
    volumes:
      - type: bind
        source: "./testfolder/data"
        target: "/data"
      - type: bind
        source: "./testfolder/etc/smbdrop"
        target: "/etc/smbdrop"
      - type: bind
        source: "../prototypes/modama-rs/dev-env/certs/"
        target: "/certs/"
    ports:
      - "127.0.0.1:1446:445"
      # - "127.0.0.1:445:445"
      - "127.0.0.1:5051:5051"
      - "127.0.0.1:5052:5052"
      - "127.0.0.1:5053:5053"
  mgmtinterface:
    volumes:
      - type: bind
        source: "../python/mgmtinterface"
        target: "/code/mgmtinterface"
        read_only: true
      - type: bind
        source: "./mgmtinterface/config-override.py"
        target: "/config.py"
        read_only: true
      - type: bind
        source: "../prototypes/modama-rs/dev-env/certs/"
        target: "/certs/"
        read_only: true
    environment:
      - FLASK_APP=mgmtinterface:app
    working_dir: /
    # command: gunicorn --bind 0.0.0.0:5000 mgmtinterface:app --log-level=debug
    command: flask run --debug --port 5000 --host 0.0.0.0
  mgmtinterface-proxy:
    volumes:
      - type: bind
        source: "./testconf/mgmtinterface-proxy.nginx.conf"
        target: "/etc/nginx/conf.d/default.conf"
    ports:
      # Match X-Forwarded-Port in testconf/mgmtinterface-proxy.nginx.conf
      # so that Flask knows its external port for absoute links
      - "127.0.0.1:5001:80"
