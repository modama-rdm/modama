[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:nginx]
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0  # disable log rotation
redirect_stderr=true
command=/usr/bin/nginx-start.sh

[eventlistener:exit_and_cron]
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0  # disable log rotation
command=/usr/bin/exit_and_cron.py
events=PROCESS_STATE_FATAL,TICK_%(ENV_ACME_RENEW_TICK)s