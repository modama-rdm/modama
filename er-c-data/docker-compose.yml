version: '3.4'
services:
  db:
    environment:
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: always
    image: postgres:12
  
  redis:
    image: "redis:alpine"
    restart: always

    command: redis-server /usr/local/etc/redis/redis.conf

    volumes:
      - type: bind
        source: "./redis.conf"
        target: "/usr/local/etc/redis/redis.conf"

    # volumes:
    #  - $PWD/redis-data:/var/lib/redis
    #   - $PWD/redis.conf:/usr/local/etc/redis/redis.conf

    environment:
     - REDIS_REPLICATION_MODE=master

  nextcloud:
    hostname: nextcloud
    build: ./nextcloud
    image: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud:latest

    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"

      REDIS_HOST: "redis"
      REDIS_HOST_PASSWORD: "redis"

      NEXTCLOUD_ADMIN_USER: root
      NEXTCLOUD_ADMIN_PASSWORD: "secret"

      NEXTCLOUD_DATA_DIR: "/var/local/nextclouddata"

      APACHE_DISABLE_REWRITE_IP: 1

      # Didn't work, unfortunately
      # TRUSTED_PROXIES: "localhost"

    depends_on:
      - "db"
      - "redis"
      - "webdav"

    volumes:
       - type: bind
         source: "../branding/favicon.jpg"
         target: "/favicon.jpg"
       - type: bind
         source: "../branding/Icon-Nextcloud.svg"
         target: "/Icon-Nextcloud.svg"    

    restart: always

  webdav-backend:
    hostname: webdav-backend
    build: './wsgidav'
    image: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav:latest
    restart: always

    volumes:
      # Use host's accounts
      # Requires libpam-sss and libnss-sss in container
      # https://jhrozek.wordpress.com/2015/03/31/authenticating-a-docker-container-against-hosts-unix-accounts/
      - type: bind
        source: "/var/lib/sss/pipes/"
        target: "/var/lib/sss/pipes/"
      - type: bind
        source: "./wsgidav.json"
        target: "/wsgidav.json"
      - "sockets:/run/gunicorn/"

  webdav:
    hostname: webdav
    image: nginx:latest
    restart: always
    volumes:
      - './webdav-proxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - './webdav-proxy.etc.nginx.nginx.conf:/etc/nginx/nginx.conf'
      - "sockets:/run/gunicorn/"

  sampledb:
    hostname: sampledb
    image: sciapp/sampledb:0.24.1
    depends_on:
      - db
    environment:
      SAMPLEDB_CONTACT_EMAIL: d.weber@fz-juelich.de
      SAMPLEDB_MAIL_SERVER: mail.fz-juelich.de
      SAMPLEDB_MAIL_SENDER: d.weber@fz-juelich.de
      # TODO put in secrets file
      SAMPLEDB_ADMIN_PASSWORD: "abcd1234"
      SAMPLEDB_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:password@db:5432/sampledb
    restart: always

  cloudproxy:
    hostname: cloudproxy
    image: nginx:latest
    restart: always
    volumes:
      - './cloudproxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - './landingpage:/usr/share/nginx/html'

    depends_on:
      - "nextcloud"
  
  permissions:
    hostname: permissions
    restart: always
    build:
      context: ..
      dockerfile: er-c-data/permissions/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/permissions:latest

    volumes:
       - type: bind
         source: "/var/lib/sss/pipes/"
         target: "/var/lib/sss/pipes/"
    
    cap_add:
      - LINUX_IMMUTABLE

  watchdog:
    hostname: watchdog
    restart: always
    build:
      context: ..
      dockerfile: er-c-data/watchdog/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/watchdog:latest

  smbdrop:
    hostname: smbdrop
    restart: always
    build:
      context: ..
      dockerfile: er-c-data/smbdrop/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop:latest
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - seccomp:unconfined
    privileged: true  # MEH! would rather only allow mount/umount

  mgmtinterface:
    hostname: mgmtinterface
    restart: always
    build:
      context: ..
      dockerfile: er-c-data/mgmtinterface/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface:latest
    environment:
      - MGMTINTERFACE_SECRET=/mgmt_secret.py
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/mgmt_secret.py"
        target: "/mgmt_secret.py"
    depends_on:
      - "permissions"
      - "smbdrop"

volumes:
  sockets:
