version: '3.4'
services:
  db:
    environment:
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: always
    image: postgres:12
  
  redis:
    image: "redis:alpine"
    restart: always

    command: redis-server /usr/local/etc/redis/redis.conf

    volumes:
      - type: bind
        source: "./redis.conf"
        target: "/usr/local/etc/redis/redis.conf"

    # volumes:
    #  - $PWD/redis-data:/var/lib/redis
    #   - $PWD/redis.conf:/usr/local/etc/redis/redis.conf

    environment:
     - REDIS_REPLICATION_MODE=master

  nextcloud:
    hostname: nextcloud
    build: ./nextcloud

    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"

      REDIS_HOST: "redis"
      REDIS_HOST_PASSWORD: "redis"

      NEXTCLOUD_ADMIN_USER: root
      NEXTCLOUD_ADMIN_PASSWORD: "secret"

      NEXTCLOUD_DATA_DIR: "/var/local/nextclouddata"

      APACHE_DISABLE_REWRITE_IP: 1

      # Didn't work, unfortunately
      # TRUSTED_PROXIES: "localhost"

    links:
      - "db"
      - "redis"
      - "webdav"

    volumes:
       - type: bind
         source: "../branding/favicon.jpg"
         target: "/favicon.jpg"
       - type: bind
         source: "../branding/Icon-Nextcloud.svg"
         target: "/Icon-Nextcloud.svg"    

    restart: always

  webdav-backend:
    hostname: webdav-backend
    build: './wsgidav'
    restart: always

    volumes:
      # Use host's accounts
      # Requires libpam-sss and libnss-sss in container
      # https://jhrozek.wordpress.com/2015/03/31/authenticating-a-docker-container-against-hosts-unix-accounts/
      - type: bind
        source: "/var/lib/sss/pipes/"
        target: "/var/lib/sss/pipes/"
      - type: bind
        source: "./wsgidav.json"
        target: "/wsgidav.json"
      - "sockets:/run/gunicorn/"

  webdav:
    hostname: webdav
    image: nginx:latest
    restart: always
    volumes:
      - './webdav-proxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - "sockets:/run/gunicorn/"

  cloudproxy:
    hostname: cloudproxy
    image: nginx:latest
    restart: always
    volumes:
      - './cloudproxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - './landingpage:/usr/share/nginx/html'

    links:
      - "nextcloud"

volumes:
  sockets:
