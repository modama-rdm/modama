version: '3.4'
services:
  db:
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/postgres"
        target: "/var/lib/postgresql/data"
  nextcloud:
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-html"
        target: "/var/www/html"
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-data"
        target: "/var/local/nextclouddata"
      - type: bind
        source: "./prodconf/nextcloud-site-config.json"
        target: "/nextcloud-site-config.json"
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-config-secret.json"
        target: "/nextcloud-config-secret.json"
      - type: bind
        source: "/var/local/data-mgmt/externalstorage_pw"
        target: "/externalstorage_pw"
  webdav-backend:
    volumes:
      # Data directory to export
      - "nfsdata:/var/wsgidav-root"
  webdav:
    volumes:
      # Data directory to export
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  cloudproxy:
    volumes:
      - './prodconf/cloudproxy-servername.nginx.conf.snippet:/etc/nginx/conf.d/servername.conf.snippet'
    ports:
      - "127.0.0.1:1889:80"
  permissions:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  watchdog:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  smbdrop:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
      - type: bind
        source: "/var/local/data-mgmt/smbdrop"
        target: "/etc/smbdrop"
    ports:
      - "127.0.0.1:1445:445"
  mgmtinterface:
    ports:
      - "80:5000"

volumes:
  nfsdata:
    driver_opts:
      type: "nfs"
      o: "addr=localhost,soft,timeo=60,intr,noexec,nosuid,rw"
      device: ":/data/er-c-data"

