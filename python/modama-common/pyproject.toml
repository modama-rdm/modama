[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modama_common"
description = "Common library and filesystem functions for modama"
license = {file = "LICENSE"}
keywords = []
requires-python = ">=3.7"
dynamic = ["version", "readme"]
dependencies = [
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 3 - Alpha",
]
authors = [
    {name="Dieter Weber", email="d.weber@fz-juelich.de"},
    {name="Alexander Clausen", email="a.clausen@fz-juelich.de"},
]

[project.urls]
repository = "https://iffgit.fz-juelich.de/weber/data-management-system"

[tool.setuptools.dynamic]
version = {attr = "modama_common.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

