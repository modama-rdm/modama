[metadata]
name = mgmtinterface-api
version = 0.0.1

[options]
zip_safe = False
include_package_data = True
package_dir =
    =src
packages = find:
python_requires = >=3.11
install_requires =
    fastapi
    itsdangerous
    pydantic-settings
    requests
    typing-extensions

[options.packages.find]
where = src
