version: '3.4'
services:
  permissions:
    hostname: permissions
    build:
      context: ..
      dockerfile: permissions/Dockerfile

    volumes:
       - type: bind
         source: "./testfolder"
         target: "/data"
       - type: bind
         source: "/var/lib/sss/pipes/"
         target: "/var/lib/sss/pipes/"
    
    cap_add:
      - LINUX_IMMUTABLE

  permissions-server:
    hostname: permissions
    build:
      context: ..
      dockerfile: permissions/Dockerfile-server

    volumes:
       - type: bind
         source: "../../er-c-data/testfolder/data"
         target: "/data"
       - type: bind
         source: "/var/lib/sss/pipes/"
         target: "/var/lib/sss/pipes/"

    ports:
      - "5050:5050"
      - "8899:8888"
    
    cap_add:
      - LINUX_IMMUTABLE
