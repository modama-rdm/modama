[metadata]
name = permissions
version = 0.0.1

[options]
zip_safe = False
include_package_data = True
package_dir =
    =src
packages = find:
python_requires = >=3.6
install_requires =
    pylibacl
    flask
    jsonschema
    pamela
    # NOTE: pysss not installable from pypi (yet?) https://github.com/SSSD/sssd/issues/5553

[options.packages.find]
where = src

[flake8]
max-line-length = 100
ignore = E24,E121,E123,E126,E128,E133,E226,E241,E242,E704,W503
exclude = .git,__pycache__,.tox,build,dist,node_modules,TOXENV
