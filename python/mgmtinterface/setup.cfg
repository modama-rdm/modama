[metadata]
name = mgmtinterface
version = 0.0.1

[options]
zip_safe = False
include_package_data = True
package_dir =
    =src
packages = find:
python_requires = >=3.6
install_requires =
    flask
    jsonschema
    wtforms
    flask-wtf
    flask-login
    flask-ldap3-login
    jinja2
    requests

[options.packages.find]
where = src
