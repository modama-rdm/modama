name: er-c-data
services:
  db:
    environment:
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: always
    image: postgres:12
  
  redis:
    image: "redis:bookworm"
    restart: always

    command: redis-server /usr/local/etc/redis/redis.conf

    volumes:
      - type: bind
        source: "./redis.conf"
        target: "/usr/local/etc/redis/redis.conf"

    # volumes:
    #  - $PWD/redis-data:/var/lib/redis
    #   - $PWD/redis.conf:/usr/local/etc/redis/redis.conf

    environment:
     - REDIS_REPLICATION_MODE=master

  nextcloud:
    hostname: nextcloud
    build: ./nextcloud
    image: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud:latest

    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"

      REDIS_HOST: "redis"
      REDIS_HOST_PASSWORD: "redis"

      NEXTCLOUD_ADMIN_USER: root
      NEXTCLOUD_ADMIN_PASSWORD: "secret"

      NEXTCLOUD_DATA_DIR: "/var/local/nextclouddata"

      APACHE_DISABLE_REWRITE_IP: 1

      # Didn't work, unfortunately
      # TRUSTED_PROXIES: "localhost"

    depends_on:
      - "db"
      - "redis"
      - "webdav"

    volumes:
       - type: bind
         source: "../branding/favicon.jpg"
         target: "/favicon.jpg"
       - type: bind
         source: "../branding/Icon-Nextcloud.svg"
         target: "/Icon-Nextcloud.svg"    

    restart: always

  webdav-backend:
    hostname: webdav-backend
    build: './wsgidav'
    image: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav:latest
    restart: always

    volumes:
      # Use accounts from sssd container
      # Requires libpam-sss and libnss-sss in container
      # https://jhrozek.wordpress.com/2015/03/31/authenticating-a-docker-container-against-hosts-unix-accounts/
      - "ssspipes:/var/lib/sss/pipes/"
      - type: bind
        source: "./wsgidav.json"
        target: "/wsgidav.json"
      - "sockets:/run/gunicorn/"
    depends_on:
      - "sssd"

  webdav:
    hostname: webdav
    image: nginx:latest
    restart: always
    volumes:
      - './webdav-proxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - './webdav-proxy.etc.nginx.nginx.conf:/etc/nginx/nginx.conf'
      - "sockets:/run/gunicorn/"

  cloudproxy:
    hostname: cloudproxy
    image: nginx:latest
    restart: always
    volumes:
      - './cloudproxy.nginx.conf:/etc/nginx/conf.d/default.conf'
      - './landingpage:/usr/share/nginx/html'

    depends_on:
      - "nextcloud"

  mgmtinterface-new: # static React SPA (new UI)
    hostname: mgmtinterface-new
    restart: always
    build:
      context: ..
      dockerfile: mgmtinterface-new/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-new:latest

  mgmtinterface-api:  # new FastAPI API (#172), served at /api/v2/
    hostname: mgmtinterface-api
    restart: always
    build:
      context: ..
      dockerfile: deploy/mgmtinterface-api/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-api:latest
    # The session signing secret is mounted with the auth slice; the scaffold has
    # no endpoints that need it.
    depends_on:
      - "permissions"

  mgmtinterface-proxy:  # another nginx, in prod this terminates TLS
    # see prod/override files for config volumes and ports
    hostname: mgmtinterface-proxy
    image: nginx:latest
    restart: always
    depends_on:
      - "mgmtinterface"
      - "mgmtinterface-new"
      - "mgmtinterface-api"

  permissions:
    hostname: permissions
    restart: always
    build:
      context: ..
      dockerfile: deploy/permissions/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/permissions:latest

    volumes:
      - "ssspipes:/var/lib/sss/pipes/"
    
    cap_add:
      - LINUX_IMMUTABLE
    depends_on:
      - "sssd"

  sssd:
    hostname: sssd
    build: './sssd'
    image: iffregistry.fz-juelich.de/weber/data-management-system/sssd:latest
    restart: always
    tmpfs:
      - /run

    volumes:
      - type: bind
        source: "/var/local/data-mgmt/sssd.conf"
        target: "/etc/sssd/sssd.conf"
      - "ssspipes:/var/lib/sss/pipes/"

  watchdog:
    hostname: watchdog
    restart: always
    build:
      context: ..
      dockerfile: deploy/watchdog/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/watchdog:latest

  smbdrop:
    hostname: smbdrop
    restart: always
    build:
      context: ../modama-rs/
      dockerfile: Dockerfile-smbdrop
    image: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop:latest
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - seccomp:unconfined
    privileged: true  # MEH! would rather only allow mount/umount
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/CA/ca/pub/"
        target: "/certs/ca/pub/"
      - type: bind
        source: "/var/local/data-mgmt/CA/servers/"
        target: "/certs/servers/"

  mgmtinterface:
    hostname: mgmtinterface
    restart: always
    build:
      context: ..
      dockerfile: deploy/mgmtinterface/Dockerfile
    image: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface:latest
    environment:
      - MGMTINTERFACE_SECRET=/mgmt_secret.py
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/mgmt_secret.py"
        target: "/mgmt_secret.py"
        read_only: true
      - type: bind
        source: "/var/local/data-mgmt/CA/ca/pub/"
        target: "/certs/ca/pub/"
        read_only: true
    depends_on:
      - "permissions"
      - "smbdrop"

volumes:
  sockets:
  ssspipes:
