# sssd against the test directory (deploy/ldap), same tree as the production config in
# sssd/sssd.conf.template. All passwords are test values.
[sssd]
services = nss, pam
domains = iff.kfa-juelich.de
config_file_version = 2
debug_level = 3

[domain/iff.kfa-juelich.de]
id_provider = ldap
auth_provider = ldap
access_provider = ldap
ldap_access_filter = memberOf=cn=iff,cn=groups,cn=accounts,dc=iff,dc=kfa-juelich,dc=de
# The test directory has the memberOf and member attributes of FreeIPA, but not its schema
ldap_schema = rfc2307bis
ldap_uri = ldap://ldap
ldap_default_bind_dn = uid=ldapbind,cn=sysaccounts,cn=etc,dc=iff,dc=kfa-juelich,dc=de
ldap_default_authtok = bind-test-password
ldap_search_base = cn=accounts,dc=iff,dc=kfa-juelich,dc=de
ldap_user_search_base = cn=users,cn=accounts,dc=iff,dc=kfa-juelich,dc=de
ldap_group_search_base = cn=groups,cn=accounts,dc=iff,dc=kfa-juelich,dc=de
# StartTLS, with a certificate that the test CA issued to the host name "ldap"
ldap_id_use_start_tls = true
ldap_tls_cacert = /certs/ca/pub/ca.cert.pem
enumerate = false
cache_credentials = true
ldap_id_mapping = false
use_fully_qualified_names = false
