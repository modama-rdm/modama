server {
    listen 80;
    listen [::]:80;

    server_name localhost:80;

    # New React UI, mounted at /new/ (mirrors prod). The legacy Flask UI keeps
    # every other path. `^~` makes nginx prefer this prefix over `/` below.
    location = /new { return 308 /new/; }
    location ^~ /new/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-new:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }

    # New FastAPI API (#172), mounted at /mgmt-api/ (mirrors prod). The legacy
    # Flask API keeps /api/. No version in the path on purpose — clients pin a
    # contract with the X-Modama-API-Version header instead. No URI part on
    # proxy_pass: the full path is forwarded so the service's own /mgmt-api
    # prefix and docs stay consistent.
    location ^~ /mgmt-api/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-api:8000;
        # $http_host, not $host: $host drops the port, and the API derives the
        # origin it expects from this header for its CSRF check. A browser on a
        # non-default port sends `Origin: http://host:5001`, which would never
        # match a port-less expectation. Same reason its redirects need it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }

    location ^~ / {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }
}
