server {
    listen 80;
    listen [::]:80;

    server_name localhost:80;

    # New React UI, mounted at /new/ (mirrors prod). The legacy Flask UI keeps
    # every other path. `^~` makes nginx prefer this prefix over `/` below.
    location = /new { return 308 /new/; }
    location ^~ /new/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-new:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }

    # New FastAPI API (#172), mounted at /api/v2/ (mirrors prod). The legacy
    # Flask API keeps /api/. No URI part on proxy_pass: the full path is
    # forwarded so the service's own /api/v2 prefix and docs stay consistent.
    location ^~ /api/v2/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }

    location ^~ / {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Should match the external address in docker-compose file
        proxy_set_header X-Forwarded-Port 5001;
   }
}
