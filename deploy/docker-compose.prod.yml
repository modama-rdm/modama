version: '3.4'
services:
  db:
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/postgres"
        target: "/var/lib/postgresql/data"
  nextcloud:
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-html"
        target: "/var/www/html"
      - type: bind
        source: "/data/holo/weber/er-c-data-nextcloud-data"
        target: "/var/local/nextclouddata"
      - type: bind
        source: "./prodconf/nextcloud-site-config.json"
        target: "/nextcloud-site-config.json"
      - type: bind
        source: "/var/local/data-mgmt/nextcloud-config-secret.json"
        target: "/nextcloud-config-secret.json"
      - type: bind
        source: "/var/local/data-mgmt/externalstorage_pw"
        target: "/externalstorage_pw"
  webdav-backend:
    volumes:
      # Data directory to export
      - "nfsdata:/var/wsgidav-root"
  webdav:
    volumes:
      # Data directory to export
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  cloudproxy:
    volumes:
      - './prodconf/cloudproxy-servername.nginx.conf.snippet:/etc/nginx/conf.d/servername.conf.snippet'
      - './prodconf/cloudproxy-sampledb.nginx.conf.snippet:/etc/nginx/conf.d/sampledb.conf.snippet'
    ports:
      - "127.0.0.1:1889:80"
  permissions:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  watchdog:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
  smbdrop:
    volumes:
      - type: bind
        source: "/data/er-c-data"
        target: "/data"
      - type: bind
        source: "/var/local/data-mgmt/smbdrop"
        target: "/etc/smbdrop"
      - type: bind
        source: "/var/local/data-mgmt/CA/ca/pub/"
        target: "/certs/ca/"
      - type: bind
        source: "/var/local/data-mgmt/CA/servers/"
        target: "/certs/servers/"
    ports:
      - "127.0.0.1:1445:445"
  mgmtinterface:
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/ca/certs/"
        target: "/certs/"

  mgmtinterface-proxy:  # another nginx to terminate TLS for the internal mgmt interface
    volumes:
      - type: bind
        source: "/var/local/data-mgmt/mgmtinterface-proxy/ssl/"
        target: "/etc/nginx/ssl/"
      - type: bind
        source: "./prodconf/mgmtinterface-proxy.nginx.conf"
        target: "/etc/nginx/conf.d/default.conf"
    ports:
      # Match external port in in prodconf/mgmtinterface-proxy.nginx.conf
      - "443:443"
      - "80:80"

  backup:
    hostname: backup
    build: ./tsm-client
    restart: always

    env_file:
      # To not have password in config
      /var/local/data-mgmt/tsm-backup-password.env

    # environment:
      # PASSWORD: "abcd.1234"
      # Dummy password for testing
      # PASSWORD comes from env_file

    volumes:
      # Config
      - type: bind
        source: "/var/local/data-mgmt/dsm.sys"
        target: "/opt/tivoli/tsm/client/ba/bin/dsm.sys"
      # Backup domains (file systems)
      # TSM doesn't cross file system boundaries and doesn't follow symbolic links,
      # i.e. each folder needs its own domain entry in dsm.sys and its own bind mount
      - type: bind
        source: "/data/er-c-data"
        target: "/mnt/data/er-c-data"
      - type: bind
        source: "/var/local/data-mgmt"
        target: "/mnt/data/data-mgmt"
      - type: bind
        source: "/data/holo/weber/er-c-data-nextcloud-data"
        target: "/mnt/data/er-c-data-nextcloud-data"
    image: iffregistry.fz-juelich.de/weber/data-management-system/tsm-client:latest

volumes:
  nfsdata:
    driver_opts:
      type: "nfs"
      o: "addr=localhost,soft,timeo=60,intr,noexec,nosuid,rw"
      device: ":/data/er-c-data"
