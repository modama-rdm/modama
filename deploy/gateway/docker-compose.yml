services:
    nginx-w-acme:
        build:
            context: .
            dockerfile: ./Dockerfile
        image: ghcr.io/modama-rdm/gateway:latest
        restart: always
        network_mode: "host"
        volumes:
         - type: bind
           source: /var/local/data-mgmt/ssl-ca/
           target: /etc/letsencrypt/ssl/
         - type: bind
           source: /var/local/data-mgmt/ssl-deploy/
           target: /etc/letsencrypt/live/
        environment:
         - ACME_DOMAIN=er-c-data.fz-juelich.de
         - ACME_CONTACT=a.clausen@fz-juelich.de
         - ACME_SERVER=letsencrypt_test
         - ACME_RENEW_TICK=5
