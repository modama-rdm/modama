name: er-c-data

# Test deployment, the default for `docker compose up` in this folder.
#
# `testenv-init` prepares the state folders in testfolder/ and the CA, see
# testconf/init-testenv.sh; the services that use them wait for it. The remaining
# secrets are throwaway test values in testconf/secrets/, which has the layout of
# /var/local/data-mgmt/. To use the site-specific files there instead (real LDAP
# settings, see docs/guide/src/development.md), set MODAMA_SECRETS_DIR=/var/local/data-mgmt
#
# Folders that testenv-init creates are mounted with the short syntax below: Docker
# creates all containers before testenv-init has run, and only the short syntax
# creates a missing host folder. A missing host *file* is an error, which is why the
# files in testconf/secrets/ are committed.
x-after-init: &after-init
  testenv-init:
    condition: service_completed_successfully

services:
  testenv-init:
    # The CA command line tool, which this script needs besides bash; same image as
    # `deploy/ca.sh` runs
    build:
      context: ../modama-rs/
      dockerfile: Dockerfile-ca-cli
    image: iffregistry.fz-juelich.de/weber/data-management-system/ca:latest
    entrypoint: ["/bin/bash", "/init-testenv.sh"]
    command: ["init"]
    restart: "no"
    cap_add:
      - LINUX_IMMUTABLE  # to remove the data folder again, `clean`
    environment:
      - TESTFOLDER=/testfolder
      - CA_PATH=/ca
      # the CA of a real site must survive `clean`
      - KEEP_CA=${MODAMA_SECRETS_DIR:+1}
    volumes:
      - "./testconf/init-testenv.sh:/init-testenv.sh:ro"
      - "./testfolder:/testfolder"
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA:/ca"
  ldap:
    # Directory with a few test users instead of the production LDAP; testconf/secrets/
    # points sssd and Nextcloud at it. Only reachable from the other containers. Its
    # data lives in a volume and is reset by `docker compose down --volumes`.
    hostname: ldap
    build: ./ldap
    image: iffregistry.fz-juelich.de/weber/data-management-system/ldap-test:latest
    restart: always
    volumes:
      - "ldapdata:/var/lib/ldap"
      # certificate for StartTLS, issued by the test CA
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/ca/pub/:/certs/ca/pub/:ro"
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/servers/ldap/:/certs/server/:ro"
    depends_on: *after-init
  db:
    depends_on: *after-init
    volumes:
      - "./testfolder/postgres:/var/lib/postgresql/data"
  nextcloud:
    depends_on: *after-init
    volumes:
      - "./testfolder/nextcloud-html:/var/www/html"
      - "./testfolder/nextcloud-data:/var/local/nextclouddata"
      - type: bind
        source: "./testconf/nextcloud-site-config.json"
        target: "/nextcloud-site-config.json"
      - type: bind
        source: "${MODAMA_SECRETS_DIR:-./testconf/secrets}/nextcloud-config-secret.json"
        target: "/nextcloud-config-secret.json"
      - type: bind
        source: "${MODAMA_SECRETS_DIR:-./testconf/secrets}/externalstorage_pw"
        target: "/externalstorage_pw"
  webdav-backend:
    depends_on:
      testenv-init:
        condition: service_completed_successfully
    volumes:
      # Data directory to export
      - "./testfolder/data/:/var/wsgidav-root"
  webdav:
    depends_on: *after-init
    volumes:
      # Data directory to export
      - "./testfolder/data/:/data/"
    ports:
      - "127.0.0.1:8081:8080"
  cloudproxy:
    volumes:
      - './testconf/cloudproxy-servername.nginx.conf.snippet:/etc/nginx/conf.d/servername.conf.snippet'
    ports:
      - "127.0.0.1:1890:80"
  permissions:
    depends_on:
      testenv-init:
        condition: service_completed_successfully
    restart: no
    volumes:
      - "./testfolder/data:/data"
      - type: bind
        source: "../python/permissions"
        target: "/code/permissions"
        read_only: true
    environment:
      - FLASK_APP=permissions.server:app
    working_dir: /
    # command: /venv/bin/gunicorn --bind 0.0.0.0:5050 permissions.server:app --log-level=debug
    # Disable threading to avoid Flask server crashes after authenticate() function is called
    # Might be related to https://sourceware.org/bugzilla/show_bug.cgi?id=21032
    command: /venv/bin/flask run --without-threads --debug --port 5050 --host 0.0.0.0
  watchdog:
    depends_on: *after-init
    volumes:
      - "./testfolder/data:/data"
  smbdrop:
    depends_on: *after-init
    volumes:
      - "./testfolder/data:/data"
      - "./testfolder/etc/smbdrop:/etc/smbdrop"
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/ca/pub/:/certs/ca/pub/"
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/servers/:/certs/servers/"
    ports:
      - "127.0.0.1:1446:445"   # smb
      # - "127.0.0.1:445:445"
      - "127.0.0.1:5051:5051"  # unauthenticated smbdrop API (http)
      - "127.0.0.1:5052:5052"  # events API (ws)
      - "127.0.0.1:5053:5053"  # token API (https)
  mgmtinterface:
    depends_on: *after-init
    volumes:
      - type: bind
        source: "../python/mgmtinterface"
        target: "/code/mgmtinterface"
        read_only: true
      - type: bind
        source: "./mgmtinterface/config-override.py"
        target: "/config.py"
        read_only: true
      - type: bind
        source: "${MODAMA_SECRETS_DIR:-./testconf/secrets}/mgmt_secret.py"
        target: "/mgmt_secret.py"
        read_only: true
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/ca/pub/:/certs/ca/pub/:ro"
    environment:
      - FLASK_APP=mgmtinterface:app
    working_dir: /
    # command: gunicorn --bind 0.0.0.0:5000 mgmtinterface:app --log-level=debug
    command: /venv/bin/flask run --debug --port 5000 --host 0.0.0.0
  mgmtinterface-api:
    depends_on: *after-init
    volumes:
      - type: bind
        source: "../python/mgmtinterface-api"
        target: "/code/mgmtinterface-api"
        read_only: true
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/ca/pub/:/certs/ca/pub/:ro"
    working_dir: /code/mgmtinterface-api
    environment:
      # Dev-only: the test VM is plain http, so a Secure cookie would never come
      # back, and the secret is a throwaway rather than a mounted file.
      - MODAMA_SESSION_COOKIE_SECURE=false
      - MODAMA_SESSION_SECRET=dev-only-not-a-real-secret
      # The vite dev server (port 5180) proxies /api here with changeOrigin, so
      # the Host no longer matches the browser's Origin and the CSRF check would
      # reject every POST. Production sets no extra origins.
      - MODAMA_CSRF_EXTRA_ORIGINS=http://localhost:5180
      # The browse links open the test stack's Nextcloud, as config-override.py
      # does for the Flask app; the other link bases keep their production
      # defaults.
      - MODAMA_NEXTCLOUD_BASE=http://localhost:1890/nextcloud/apps/files/?dir=/ER-C-Data/
    command: >
      /venv/bin/uvicorn mgmtinterface_api.main:app --reload
      --host 0.0.0.0 --port 8000
  sssd:
    depends_on:
      ldap:
        # sssd goes offline for a while if it asks before the directory is loaded
        condition: service_healthy
    # sssd only accepts a config file that belongs to root and is not readable by others,
    # which a file of the checkout never is: use a copy
    volumes: !override
      - "ssspipes:/var/lib/sss/pipes/"
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/sssd.conf:/sssd.conf.in:ro"
      # to trust the test directory; the config file says where
      - "${MODAMA_SECRETS_DIR:-./testconf/secrets}/CA/ca/pub/:/certs/ca/pub/:ro"
    command:
      - "/bin/sh"
      - "-c"
      - "install -m 600 -o root -g root /sssd.conf.in /etc/sssd/sssd.conf && exec /usr/sbin/sssd --interactive"
  mgmtinterface-proxy:
    volumes:
      - type: bind
        source: "./testconf/mgmtinterface-proxy.nginx.conf"
        target: "/etc/nginx/conf.d/default.conf"
    ports:
      # Match X-Forwarded-Port in testconf/mgmtinterface-proxy.nginx.conf
      # so that Flask knows its external port for absoute links
      - "127.0.0.1:5001:80"

volumes:
  ldapdata:
