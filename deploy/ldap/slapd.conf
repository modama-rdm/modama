# Configuration of the test directory; the root password is added by entrypoint.sh
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis-bis.schema
include /etc/ldap/schema/inetorgperson.schema

pidfile /run/slapd/slapd.pid
modulepath /usr/lib/ldap
moduleload back_mdb
moduleload memberof

database mdb
directory /var/lib/ldap
suffix "dc=iff,dc=kfa-juelich,dc=de"
rootdn "cn=admin,dc=iff,dc=kfa-juelich,dc=de"
index objectClass,uid,uidNumber,gidNumber,memberOf,member eq

# memberOf on the user entries, like FreeIPA
overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint true

# Nothing without a bind, and passwords never readable
access to attrs=userPassword by anonymous auth by self write by * none
access to * by users read by * none
