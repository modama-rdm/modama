server {
    listen 80;
    listen [::]:80;
    server_name er-c-data-mgmt.fz-juelich.de;
    return 301 https://$server_name$request_uri;
}

server {
    # later: enable http3/quic
    # listen 443 quic reuseport;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name er-c-data-mgmt.fz-juelich.de;

    ssl_certificate /etc/nginx/ssl/er-c-data-mgmt.fz-juelich.de.chain.pem;
    ssl_certificate_key /etc/nginx/ssl/er-c-data-mgmt.fz-juelich.de.privkey.pem;

    # New React UI, mounted at /new/. The legacy Flask UI keeps every other path
    # (including the domain root), so it stays the default until the migration is
    # complete. `^~` makes nginx prefer this prefix over the `/` location below.
    location = /new { return 308 /new/; }
    location ^~ /new/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-new:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
   }

    # New FastAPI API (#172), mounted at /mgmt-api/. The legacy Flask API keeps
    # /api/, so `modama-agent` is unaffected. The path carries no version:
    # clients state the contract they were built against in the
    # X-Modama-API-Version header, so this prefix never has to change. No URI
    # part on proxy_pass: the full path is forwarded, so the service's own
    # /mgmt-api route prefix and its OpenAPI docs stay self-consistent.
    location ^~ /mgmt-api/ {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface-api:8000;
        # $http_host, not $host: $host drops the port, and the API derives the
        # origin it expects from this header for its CSRF check. A browser on a
        # non-default port sends `Origin: http://host:5001`, which would never
        # match a port-less expectation. Same reason its redirects need it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
   }

    location ^~ / {
        proxy_http_version 1.1;

        proxy_pass http://mgmtinterface:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Match external port
        proxy_set_header X-Forwarded-Port 443;
   }
}
