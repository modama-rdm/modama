# /etc/nginx/conf.d/default.conf

upstream app_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response
    server unix:/run/gunicorn/gunicorn.socket fail_timeout=0;
}

server {
    listen       8080;
    client_max_body_size 0;  # disable body size limit, we trust nextcloud (is that wise?)
    location / {
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;

        client_body_timeout 3600s;
        proxy_read_timeout 3600;

        proxy_set_header Host webdav:8080;
        proxy_pass http://app_server;
    }

    # handle internal requests (i.e. X-Accel-Redirect) 
    # for example, X-Accel-Redirect: /protected/adhoc/testfile.large
    # will send /data/adhoc/testfile.large
    location /protected/ {
        internal;
        alias /data/;
    }
}
