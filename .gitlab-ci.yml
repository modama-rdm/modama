workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 250
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

before_script:
  - export PATH="$CARGO_HOME/bin:$PATH"

unit-tests:
  stage: test
  image: debian:13-slim
  script:
    - apt-get -y update && apt-get -y upgrade && apt-get -y install python3-full
    - python3 -m venv /venv/
    - /venv/bin/pip install pytest httpx2
    - /venv/bin/pip install ./python/smbdrop-client
    - /venv/bin/pip install ./python/permissions-client
    - /venv/bin/pip install ./python/mgmtinterface-client
    - /venv/bin/pip install -e ./python/mgmtinterface
    - /venv/bin/pip install -e ./python/mgmtinterface-api
    - cd $CI_PROJECT_DIR/python/mgmtinterface/ && /venv/bin/pytest tests
    - cd $CI_PROJECT_DIR/python/mgmtinterface-api/ && /venv/bin/pytest tests

rust-tests:
  stage: test
  parallel:
    matrix:
      - RUST_VERSION: ['1', '1.94']
  image: rust:${RUST_VERSION}-slim-trixie
  script:
    - apt-get -y update && apt-get -y install lld build-essential git libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 vulkan-tools
    - vulkaninfo --summary
    - rustup component add clippy
    - just --version || cargo install just --locked
    - git fetch --tags
    - cd modama-rs/
    - cargo check --workspace --all-targets --all-features --locked && cargo clippy --all-targets --all-features --locked -- -D warnings && cargo test --locked
    - just visual-tests
  cache:
    key:
      files:
        - modama-rs/Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

# the `ring` crate doesn't build on the gnu toolchain, so while we can still
# run clippy as a basic smoke test, the full build is not enabled here.
# might be worth it to remove this once we have a building and running configuration.
windows-clippy:
  stage: test
  image: rust:1-slim-trixie
  script:
    - apt-get -y update && apt-get -y install gcc-mingw-w64-x86-64-win32
    - just --version || cargo install just --locked -q
    - cd modama-rs/
    - just win7-install-toolchain
    - just win7-check-gnu
  cache:
    key:
      files:
        - modama-rs/Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

windows-7-llvm:
  stage: build
  # start right away instead of waiting for the test stage
  needs: []
  image: rust:1-slim-trixie
  script:
    - apt-get -y update && apt-get -y install clang-tools-19 lld llvm
    - xwin --version || cargo install xwin --locked
    - just --version || cargo install just --locked -q
    - cd modama-rs/
    - just win7-install-toolchain
    - just win7-xwin-splat
    - just win7-check-msvc
    - just win7-check-agent-imports
  artifacts:
    expire_in: 1 week
    expose_as: "agent binaries windows 7"
    paths:
      - modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent.exe
      - modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent-gui.exe
  cache:
    key:
      files:
        - modama-rs/Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

# zig is only used as the C compiler/linker for cargo-zigbuild, so the binaries
# only require glibc 2.17 (see `linux_glibc` in modama-rs/ci.just).
linux-agent:
  stage: build
  # start right away instead of waiting for the test stage
  needs: []
  image: rust:1-slim-trixie
  variables:
    ZIG_VERSION: "0.15.2"
    ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
  script:
    - apt-get -y update && apt-get -y install curl xz-utils binutils pkg-config libglib2.0-dev
    - |
      if [ ! -x ".zig/$ZIG_VERSION/zig" ]; then
        curl --fail -sSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
        echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
        rm -rf .zig && mkdir -p ".zig/$ZIG_VERSION"
        tar -xJf zig.tar.xz -C ".zig/$ZIG_VERSION" --strip-components=1
        rm zig.tar.xz
      fi
    - export PATH="$CI_PROJECT_DIR/.zig/$ZIG_VERSION:$PATH"
    - cargo-zigbuild --version || cargo install cargo-zigbuild --locked -q
    - just --version || cargo install just --locked -q
    - cd modama-rs/
    - just -f ci.just linux-check-agent-glibc
  artifacts:
    expire_in: 1 week
    expose_as: "agent binaries linux"
    paths:
      - modama-rs/target/x86_64-unknown-linux-gnu/release/modama-agent
      - modama-rs/target/x86_64-unknown-linux-gnu/release/modama-agent-gui
  cache:
    key:
      files:
        - modama-rs/Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .zig/

py-lint-and-format:
  stage: test
  image: ghcr.io/astral-sh/uv:debian
  script:
    - uvx ruff format --check --diff
    - uvx ruff check

mgmtinterface-new-tests:
  stage: test
  image: node:22-slim
  script:
    - cd mgmtinterface-new
    - npm ci
    - npm run lint
    - npm run build
    - npm test

container-image-build:
  stage: build
  image:
    name: quay.io/buildah/stable:v1.43.2
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: oci
    PUSH_IMAGE: "false"
  rules:
    - if: $CI_PROJECT_PATH == "weber/data-management-system" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == "weber/data-management-system"
      variables:
        PUSH_IMAGE: "true"
    - if: $CI_PROJECT_PATH == "weber/data-management-system" && $CI_PIPELINE_SOURCE != "merge_request_event"
      variables:
        PUSH_IMAGE: "true"
    - when: on_success
  parallel:
    matrix:
      - DOCKERFILE: deploy/gateway/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/gateway"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/gateway
      - DOCKERFILE: deploy/nextcloud/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/nextcloud"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud
      - DOCKERFILE: deploy/permissions/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/permissions
      - DOCKERFILE: deploy/sssd/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/sssd
      - DOCKERFILE: deploy/watchdog/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/watchdog
      - DOCKERFILE: modama-rs/Dockerfile-smbdrop
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop
      - DOCKERFILE: modama-rs/Dockerfile-ca-cli
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/ca
      - DOCKERFILE: deploy/mgmtinterface/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface
      - DOCKERFILE: deploy/mgmtinterface-api/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-api
      - DOCKERFILE: deploy/wsgidav/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/wsgidav/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav
      - DOCKERFILE: deploy/tsm-client/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/tsm-client/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/tsm-client
      - DOCKERFILE: mgmtinterface-new/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-new

  script:
    - buildah
        --registries-conf "$CI_PROJECT_DIR/.gitlab/containers-registries.conf"
        bud
        --file "$DOCKERFILE"
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHA}"
        "$CONTEXT"
    - |
      if [ "$PUSH_IMAGE" = "true" ]; then
        echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        buildah push --force-compression --compression-format zstd "${IMAGE_NAME}:${CI_COMMIT_SHA}"
      else
        echo "Skipping image push outside the upstream project."
      fi

container-image-retag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "weber/data-management-system"
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - IMAGE_NAME: gateway
      - IMAGE_NAME: nextcloud
      - IMAGE_NAME: permissions
      - IMAGE_NAME: sssd
      - IMAGE_NAME: watchdog
      - IMAGE_NAME: smbdrop
      - IMAGE_NAME: ca
      - IMAGE_NAME: mgmtinterface
      - IMAGE_NAME: wsgidav
      - IMAGE_NAME: tsm-client
      - IMAGE_NAME: mgmtinterface-new
      - IMAGE_NAME: mgmtinterface-api
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA latest
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA ${CI_COMMIT_TAG}

# Maintainers create the release (tag + description) in the GitLab UI, so this
# only uploads the binaries to the generic package registry (as package
# modama-agent, version = tag) and attaches them to that release. The `release:`
# keyword would overwrite the release's name and description instead.
agent-release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "weber/data-management-system"
  image: registry.gitlab.com/gitlab-org/cli:v1.123.0
  variables:
    GIT_STRATEGY: none
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: linux-agent
      artifacts: true
    - job: windows-7-llvm
      artifacts: true
    # the builds don't wait for the tests, so don't release untested binaries
    - job: rust-tests
      artifacts: false
    - job: windows-clippy
      artifacts: false
  script:
    - mkdir dist
    - cp modama-rs/target/x86_64-unknown-linux-gnu/release/modama-agent dist/modama-agent-linux-x86_64
    - cp modama-rs/target/x86_64-unknown-linux-gnu/release/modama-agent-gui dist/modama-agent-gui-linux-x86_64
    - cp modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent.exe dist/modama-agent-win7-x86_64.exe
    - cp modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent-gui.exe dist/modama-agent-gui-win7-x86_64.exe
    - (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
    # -R: without a checkout, glab can't infer the project from the git remote
    - glab release upload "$CI_COMMIT_TAG" -R "$CI_PROJECT_URL" --use-package-registry --package-name modama-agent
        "dist/modama-agent-linux-x86_64#modama-agent (Linux x86_64, glibc >= 2.17)#package"
        "dist/modama-agent-gui-linux-x86_64#modama-agent-gui (Linux x86_64, glibc >= 2.17)#package"
        "dist/modama-agent-win7-x86_64.exe#modama-agent (Windows 7+ x86_64)#package"
        "dist/modama-agent-gui-win7-x86_64.exe#modama-agent-gui (Windows 7+ x86_64)#package"
        "dist/SHA256SUMS#SHA256SUMS#other"
