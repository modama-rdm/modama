workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 250

unit-tests:
  stage: test
  image: debian:13-slim
  script:
    - apt-get -y update && apt-get -y upgrade && apt-get -y install python3-full
    - python3 -m venv /venv/
    - /venv/bin/pip install pytest
    - /venv/bin/pip install ./python/smbdrop-client
    - /venv/bin/pip install ./python/permissions-client
    - /venv/bin/pip install ./python/mgmtinterface-client
    - /venv/bin/pip install -e ./python/mgmtinterface
    - cd python/mgmtinterface/ && /venv/bin/pytest tests

rust-tests:
  stage: test
  image: rust:1-slim-trixie
  script:
    - apt-get -y update && apt-get -y install lld build-essential git libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 vulkan-tools
    - vulkaninfo --summary
    - rustup component add clippy
    - cargo install just
    - git fetch --tags
    - cd modama-rs/
    - cargo check --all-targets --all-features && cargo clippy --all-targets --all-features && cargo test
    - just visual-tests

lint-and-format:
  stage: test
  image: ghcr.io/astral-sh/uv:debian
  script:
    - uvx ruff format --check --diff
    - uvx ruff check

mgmtinterface-new-tests:
  stage: test
  image: node:22-slim
  script:
    - cd mgmtinterface-new
    - npm ci
    - npm run lint
    - npm run build
    - npm test

container-image-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.16.0-debug
    entrypoint: [""]
  parallel:
    matrix:
      - DOCKERFILE: deploy/gateway/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/gateway"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/gateway
      - DOCKERFILE: deploy/nextcloud/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/nextcloud"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud
      - DOCKERFILE: deploy/permissions/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/permissions
      - DOCKERFILE: deploy/sssd/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/sssd
      - DOCKERFILE: deploy/watchdog/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/watchdog
      - DOCKERFILE: modama-rs/Dockerfile-smbdrop
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop
      - DOCKERFILE: modama-rs/Dockerfile-ca-cli
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/ca
      - DOCKERFILE: deploy/mgmtinterface/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface
      - DOCKERFILE: deploy/wsgidav/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/wsgidav/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav
      - DOCKERFILE: deploy/tsm-client/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/tsm-client/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/tsm-client
      - DOCKERFILE: mgmtinterface-new/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-new

  script:
    - /kaniko/executor
        --context $CONTEXT
        --dockerfile $DOCKERFILE
        --destination "${IMAGE_NAME}:${CI_COMMIT_SHA}"

container-image-retag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - IMAGE_NAME: gateway
      - IMAGE_NAME: nextcloud
      - IMAGE_NAME: permissions
      - IMAGE_NAME: sssd
      - IMAGE_NAME: watchdog
      - IMAGE_NAME: smbdrop
      - IMAGE_NAME: ca
      - IMAGE_NAME: mgmtinterface
      - IMAGE_NAME: wsgidav
      - IMAGE_NAME: tsm-client
      - IMAGE_NAME: mgmtinterface-new
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA latest
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA ${CI_COMMIT_TAG}
