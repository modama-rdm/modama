stages:
  - build


container-image-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  parallel:
    matrix:
      - DOCKERFILE:
        - er-c-data/permissions/Dockerfile
        - er-c-data/watchdog/Dockerfile
        - er-c-data/smbdrop/Dockerfile
        - er-c-data/mgmtinterface/Dockerfile
        - er-c-data/wsgidav/Dockerfile

  script:
    # TODO:
    # - login, tag images, and push them to the registry

    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile $DOCKERFILE
        --no-push
