workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 250
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

before_script:
  - export PATH="$CARGO_HOME/bin:$PATH"

unit-tests:
  stage: test
  image: debian:13-slim
  script:
    - apt-get -y update && apt-get -y upgrade && apt-get -y install python3-full
    - python3 -m venv /venv/
    - /venv/bin/pip install pytest
    - /venv/bin/pip install ./python/smbdrop-client
    - /venv/bin/pip install ./python/permissions-client
    - /venv/bin/pip install ./python/mgmtinterface-client
    - /venv/bin/pip install -e ./python/mgmtinterface
    - cd python/mgmtinterface/ && /venv/bin/pytest tests

rust-tests:
  stage: test
  parallel:
    matrix:
      - RUST_VERSION: ['1', '1.92']
  image: rust:${RUST_VERSION}-slim-trixie
  script:
    - apt-get -y update && apt-get -y install lld build-essential git libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 vulkan-tools
    - vulkaninfo --summary
    - rustup component add clippy
    - just --version || cargo install just --locked
    - git fetch --tags
    - cd modama-rs/
    - cargo check --workspace --all-targets --all-features --locked && cargo clippy --all-targets --all-features --locked -- -D warnings && cargo test --locked
    - just visual-tests
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

# the `ring` crate doesn't build on the gnu toolchain, so while we can still
# run clippy as a basic smoke test, the full build is not enabled here.
# might be worth it to remove this once we have a building and running configuration.
windows-7-gnu-experimental:
  stage: test
  image: rust:1-slim-trixie
  script:
    - apt-get -y update && apt-get -y install gcc-mingw-w64-x86-64-win32
    - rustup toolchain install nightly-2025-09-28 --profile minimal --component rust-src --component clippy
    - just --version || cargo install just --locked -q
    - cd modama-rs/
    - just win-clippy-gnu
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

windows-7-llvm:
  stage: build
  image: rust:1-slim-trixie
  script:
    - apt-get -y update && apt-get -y install clang-tools-19 lld llvm
    - rustup toolchain install nightly-2025-09-28 --profile minimal --component rust-src --component clippy
    - xwin --version || cargo install xwin --locked
    - just --version || cargo install just --locked -q
    - cd modama-rs/
    - xwin --accept-license --arch x86_64 splat --output .xwin-cache/splat
    - export CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_LINKER=lld-link
    - export CC_x86_64_win7_windows_msvc=clang-cl-19
    - export CXX_x86_64_win7_windows_msvc=clang-cl-19
    - export AR_x86_64_win7_windows_msvc=llvm-lib
    - export CFLAGS_x86_64_win7_windows_msvc="/imsvc$PWD/.xwin-cache/splat/crt/include /imsvc$PWD/.xwin-cache/splat/sdk/include/ucrt /imsvc$PWD/.xwin-cache/splat/sdk/include/shared /imsvc$PWD/.xwin-cache/splat/sdk/include/um"
    - export RUSTFLAGS="--cfg windows_slim_errors -C panic=abort -C target-feature=+crt-static -L native=$PWD/.xwin-cache/splat/crt/lib/x86_64 -L native=$PWD/.xwin-cache/splat/sdk/lib/um/x86_64 -L native=$PWD/.xwin-cache/splat/sdk/lib/ucrt/x86_64"
    - cargo +nightly-2025-09-28 check -q -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc -p modama-common --lib --locked
    - cargo +nightly-2025-09-28 clippy -q -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc -p modama-agent --lib --bins --all-features --locked -- -D warnings
    - cargo +nightly-2025-09-28 clippy -q -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc -p modama-agent-gui --lib --bins --locked -- -D warnings
    - just win7-check-agent-imports
  artifacts:
    expire_in: 1 week
    paths:
      - modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent.exe
      - modama-rs/target/x86_64-win7-windows-msvc/release/modama-agent-gui.exe
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/bin/
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

lint-and-format:
  stage: test
  image: ghcr.io/astral-sh/uv:debian
  script:
    - uvx ruff format --check --diff
    - uvx ruff check

mgmtinterface-new-tests:
  stage: test
  image: node:22-slim
  script:
    - cd mgmtinterface-new
    - npm ci
    - npm run lint
    - npm run build
    - npm test

container-image-build:
  stage: build
  image:
    name: quay.io/buildah/stable:v1.43.2
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: oci
    PUSH_IMAGE: "false"
  rules:
    - if: $CI_PROJECT_PATH == "weber/data-management-system" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == "weber/data-management-system"
      variables:
        PUSH_IMAGE: "true"
    - if: $CI_PROJECT_PATH == "weber/data-management-system" && $CI_PIPELINE_SOURCE != "merge_request_event"
      variables:
        PUSH_IMAGE: "true"
    - when: on_success
  parallel:
    matrix:
      - DOCKERFILE: deploy/gateway/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/gateway"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/gateway
      - DOCKERFILE: deploy/nextcloud/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/nextcloud"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud
      - DOCKERFILE: deploy/permissions/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/permissions
      - DOCKERFILE: deploy/sssd/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/sssd
      - DOCKERFILE: deploy/watchdog/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/watchdog
      - DOCKERFILE: modama-rs/Dockerfile-smbdrop
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop
      - DOCKERFILE: modama-rs/Dockerfile-ca-cli
        CONTEXT: "${CI_PROJECT_DIR}/modama-rs"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/ca
      - DOCKERFILE: deploy/mgmtinterface/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface
      - DOCKERFILE: deploy/wsgidav/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/wsgidav/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav
      - DOCKERFILE: deploy/tsm-client/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/deploy/tsm-client/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/tsm-client
      - DOCKERFILE: mgmtinterface-new/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface-new

  script:
    - buildah
        --registries-conf "$CI_PROJECT_DIR/.gitlab/containers-registries.conf"
        bud
        --file "$DOCKERFILE"
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHA}"
        "$CONTEXT"
    - |
      if [ "$PUSH_IMAGE" = "true" ]; then
        echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        buildah push --force-compression --compression-format zstd "${IMAGE_NAME}:${CI_COMMIT_SHA}"
      else
        echo "Skipping image push outside the upstream project."
      fi

container-image-retag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "weber/data-management-system"
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - IMAGE_NAME: gateway
      - IMAGE_NAME: nextcloud
      - IMAGE_NAME: permissions
      - IMAGE_NAME: sssd
      - IMAGE_NAME: watchdog
      - IMAGE_NAME: smbdrop
      - IMAGE_NAME: ca
      - IMAGE_NAME: mgmtinterface
      - IMAGE_NAME: wsgidav
      - IMAGE_NAME: tsm-client
      - IMAGE_NAME: mgmtinterface-new
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA latest
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA ${CI_COMMIT_TAG}
