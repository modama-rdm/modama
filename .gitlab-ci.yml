workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

unit-tests:
  stage: test
  image: debian:11-slim
  script:
    - apt-get -y update && apt-get -y upgrade && apt-get -y install python3 python3-pip
    - python3 -m pip install pytest
    - python3 -m pip install ./python/smbdrop-client
    - python3 -m pip install ./python/permissions-client
    - python3 -m pip install ./python/mgmtinterface-client
    - python3 -m pip install -e ./python/mgmtinterface
    - cd python/mgmtinterface/ && pytest tests

container-image-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.16.0-debug
    entrypoint: [""]
  parallel:
    matrix:
      - DOCKERFILE: er-c-data/gateway/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/er-c-data/gateway"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/gateway
      - DOCKERFILE: er-c-data/nextcloud/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/er-c-data/nextcloud"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/nextcloud
      - DOCKERFILE: er-c-data/permissions/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/permissions
      - DOCKERFILE: er-c-data/sssd/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/sssd
      - DOCKERFILE: er-c-data/watchdog/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/watchdog
      - DOCKERFILE: er-c-data/smbdrop/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop
      - DOCKERFILE: er-c-data/mgmtinterface/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface
      - DOCKERFILE: er-c-data/wsgidav/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/er-c-data/wsgidav/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav
      - DOCKERFILE: er-c-data/tsm-client/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/er-c-data/tsm-client/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/tsm-client

  script:
    - /kaniko/executor
        --context $CONTEXT
        --dockerfile $DOCKERFILE
        --destination "${IMAGE_NAME}:${CI_COMMIT_SHA}"

container-image-retag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - IMAGE_NAME: gateway
      - IMAGE_NAME: nextcloud
      - IMAGE_NAME: permissions
      - IMAGE_NAME: sssd
      - IMAGE_NAME: watchdog
      - IMAGE_NAME: smbdrop
      - IMAGE_NAME: mgmtinterface
      - IMAGE_NAME: wsgidav
      - IMAGE_NAME: tsm-client
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA latest
    - crane tag iffregistry.fz-juelich.de/weber/data-management-system/$IMAGE_NAME:$CI_COMMIT_SHA ${CI_COMMIT_TAG}
