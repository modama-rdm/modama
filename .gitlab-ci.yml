stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

container-image-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  parallel:
    matrix:
      - DOCKERFILE: er-c-data/permissions/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/permissions
      - DOCKERFILE: er-c-data/watchdog/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/watchdog
      - DOCKERFILE: er-c-data/smbdrop/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/smbdrop
      - DOCKERFILE: er-c-data/mgmtinterface/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/mgmtinterface
      - DOCKERFILE: er-c-data/wsgidav/Dockerfile
        CONTEXT: "${CI_PROJECT_DIR}/er-c-data/wsgidav/"
        IMAGE_NAME: iffregistry.fz-juelich.de/weber/data-management-system/wsgidav

  script:
    - /kaniko/executor
        --context $CONTEXT
        --dockerfile $DOCKERFILE
        --destination "${IMAGE_NAME}:${CI_COMMIT_SHA}"
